spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/restmanager
    username: restmanager
    password: restmanager
  jpa:
    hibernate:
      # O esquema é criado por docker/db/init/01-schema.sql.
      # "validate" faz o Spring conferir, ao subir, se as entidades batem com as tabelas.
      ddl-auto: validate

app:
  websocket:
    allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    # No Docker vem do .env; o valor depois dos ":" é só o padrão para rodar no IntelliJ
    secret: ${JWT_SECRET:segredo-de-desenvolvimento-com-mais-de-32-caracteres}
    expiracao-minutos: 480